[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fakerecogna2"
version = "0.9.0"
description = "Detecção de Fake News em Português Brasileiro: pipeline experimental da dissertação de mestrado (FakeRecogna 2.0)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Guilherme Oliveira Silva", email = "guilherme.oliveirasilva@gmail.com" },
]
keywords = ["fake-news", "nlp", "portuguese", "bert", "bertimbau", "fakerecogna"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<2.0",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "tabulate>=0.9",
  "tqdm>=4.65",
  "nltk>=3.8",
  "spacy>=3.6",
  "datasets>=2.14",
  "datasketch>=1.6",
  "sumy>=0.11",
  "sentencepiece>=0.1.99",
  "protobuf>=4.21",
  "torch>=2.0",
  "transformers>=4.35",
  "lime>=0.2.0.1",
  "captum>=0.7",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
